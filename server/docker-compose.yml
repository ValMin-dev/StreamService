services:
  db:
    container_name: twitchcopy-db
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - twitchcopy-backend

  redis:
    container_name: redis
    image: redis:5.0
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data
    networks:
      - twitchcopy-backend
volumes:
  postgres_data:
  redis_data:

networks:
  twitchcopy-backend:
