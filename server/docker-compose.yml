version: '3.7'

services:
    db:
        container_name: twitchcopy-db1
        image: postgres:15.2
        restart: always
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - twitchcopy-server1
    redis:
        container_name: twitchcopy-redis1
        image: redis:5.0
        restart: always
        ports:
            - '6379:6379'
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - twitchcopy-server1

volumes:
    postgres_data:
    redis_data:

networks:
    twitchcopy-server1:
